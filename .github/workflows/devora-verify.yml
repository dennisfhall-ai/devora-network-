name: Devora verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only read repository contents. Verification is not a repair or release.
permissions:
  contents: read

concurrency:
  group: devora-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/devora-trusted-verify.yml
