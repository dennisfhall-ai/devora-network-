name: Devora SLRA verification evidence (nonrelease)
on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Full 40-character SHA of main to verify (must match live main)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: devora-slra-readonly-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Validate exact SHA and operator intent
        env:
          EXPECTED_SHA: ${{ inputs.expected_main_sha }}
        run: |
          node --input-type=module -e '
            import {execFileSync} from "node:child_process";
            const expected = process.env.EXPECTED_SHA || "";
            const actual = execFileSync("git", ["rev-parse","HEAD"], {encoding:"utf8"}).trim();
            const repository = process.env.GITHUB_REPOSITORY;
            if (repository !== "dennisfhall-ai/devora-network-") throw Error("Wrong repository");
            if (!/^[a-f0-9]{40}$/.test(expected) || expected !== actual) throw Error("SHA mismatch or malformed requested revision");
            console.log("Verified exact source revision: " + actual);
          '
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run protected Devora suite and write local evidence
        id: suite
        shell: bash
        run: |
          set +e
          npm test > devora-test-output.log 2>&1
          result=$?
          printf '%s\n' "$result" > devora-test-exit-code.txt
          cat devora-test-output.log
          exit "$result"
      - name: Write nonprivileged receipt
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.suite.outcome }}
          EXPECTED_SHA: ${{ inputs.expected_main_sha }}
        run: |
          node --input-type=module -e '
            import {writeFileSync,existsSync,readFileSync} from "node:fs";
            import {execFileSync} from "node:child_process";
            const sha=execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim();
            const code=existsSync("devora-test-exit-code.txt")?Number(readFileSync("devora-test-exit-code.txt","utf8").trim()):null;
            const receipt={
              schema:"dfh.devora.github-actions-verification.v1",
              source:"github-actions", // NOT an authenticated SLRA repair-host receipt or independent acceptance
              repository:process.env.GITHUB_REPOSITORY,
              commit_sha:sha,
              expected_main_sha:process.env.EXPECTED_SHA,
              workflow_run_id:process.env.GITHUB_RUN_ID,
              event:process.env.GITHUB_EVENT_NAME,
              outcome:process.env.TEST_OUTCOME,
              exit_code:Number.isInteger(code)?code:null,
              trusted_worker_authorized:false,
              independent_security_review:false,
              production_release_authorized:false
            };
            writeFileSync("devora-verification-receipt.json",JSON.stringify(receipt,null,2)+"\n");
          '
      - name: Upload audit evidence (no credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devora-verification-${{ github.run_id }}
          path: |
            devora-verification-receipt.json
            devora-test-exit-code.txt
            devora-test-output.log
          retention-days: 14
